name: Rubydex benchmark

on:
  workflow_dispatch:
    inputs:
      lab:
        description: Benchmark lab
        required: true
        type: choice
        default: "05"
        options:
          - "04"
          - "05"
      model:
        description: OpenAI model
        required: true
        type: string
        default: gpt-5.6-luna
      reasoning:
        description: Reasoning effort
        required: true
        type: choice
        default: medium
        options:
          - low
          - medium
          - high
      repetitions:
        description: Samples per condition
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "3"
  push:
    branches: [main]
    paths:
      - benchmarks/requests/current.json

permissions:
  contents: read
  actions: read

concurrency:
  group: rubydex-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: resolve-config
    runs-on: ubuntu-latest
    outputs:
      lab: ${{ steps.resolve.outputs.lab }}
      model: ${{ steps.resolve.outputs.model }}
      reasoning: ${{ steps.resolve.outputs.reasoning }}
      repetitions: ${{ steps.resolve.outputs.repetitions }}
      repeats_json: ${{ steps.resolve.outputs.repeats_json }}

    steps:
      - name: Checkout rubydex-labs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve benchmark configuration
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LAB: ${{ inputs.lab }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_REASONING: ${{ inputs.reasoning }}
          INPUT_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              cfg = {
                  "lab": os.environ["INPUT_LAB"],
                  "model": os.environ["INPUT_MODEL"],
                  "reasoning": os.environ["INPUT_REASONING"],
                  "repetitions": int(os.environ["INPUT_REPETITIONS"]),
              }
          else:
              cfg = json.loads(Path("benchmarks/requests/current.json").read_text())

          if cfg["lab"] not in {"04", "05"}:
              raise SystemExit(f"Unsupported lab: {cfg['lab']}")
          if cfg["reasoning"] not in {"low", "medium", "high"}:
              raise SystemExit(f"Unsupported reasoning: {cfg['reasoning']}")
          if int(cfg["repetitions"]) not in {1, 3}:
              raise SystemExit("repetitions must be 1 or 3")
          if not str(cfg["model"]).strip():
              raise SystemExit("model must not be empty")

          repetitions = int(cfg["repetitions"])
          print(f"lab={cfg['lab']}")
          print(f"model={cfg['model']}")
          print(f"reasoning={cfg['reasoning']}")
          print(f"repetitions={repetitions}")
          print("repeats_json=[1]" if repetitions == 1 else "repeats_json=[1,2,3]")
          PY

  benchmark:
    name: sample-${{ matrix.condition }}-r${{ matrix.repeat }}
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        condition: [A, B]
        repeat: ${{ fromJSON(needs.config.outputs.repeats_json) }}

    steps:
      - name: Checkout rubydex-labs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout pinned Discourse
        uses: actions/checkout@v5
        with:
          repository: discourse/discourse
          ref: c89b1a0506a3ec0a249b7f23ac86763b358dc177
          path: discourse
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true

      - name: Validate OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets." >&2
            exit 1
          fi

      - name: Prepare benchmark sample
        id: prepare
        env:
          LAB: ${{ needs.config.outputs.lab }}
          CONDITION: ${{ matrix.condition }}
          REPEAT: ${{ matrix.repeat }}
          MODEL: ${{ needs.config.outputs.model }}
          REASONING: ${{ needs.config.outputs.reasoning }}
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/benchmark-output"
          codex_home="$RUNNER_TEMP/codex-home"
          mkdir -p "$output_dir" "$codex_home"

          if [ "$LAB" = "04" ]; then
            if [ "$CONDITION" = "A" ]; then
              prompt_file="labs/04-real-discourse/task.md"
            else
              prompt_file="labs/04-real-discourse/task-semantic-first.md"
            fi
          elif [ "$LAB" = "05" ]; then
            if [ "$CONDITION" = "A" ]; then
              prompt_file="labs/05-real-impact-map/task.md"
            else
              prompt_file="labs/05-real-impact-map/task-semantic-first.md"
            fi
          else
            echo "Unsupported lab: $LAB" >&2
            exit 2
          fi

          cat > "$codex_home/config.toml" <<EOF
          approval_policy = "never"
          EOF

          if [ "$CONDITION" = "B" ]; then
            cat >> "$codex_home/config.toml" <<EOF

          [mcp_servers.rubydex]
          command = "env"
          args = ["BUNDLE_GEMFILE=${GITHUB_WORKSPACE}/Gemfile", "bundle", "exec", "rdx", "mcp"]
          cwd = "${GITHUB_WORKSPACE}/discourse"
          enabled = true
          required = true
          default_tools_approval_mode = "approve"
          EOF
          fi

          python3 - "$output_dir/meta.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "lab": os.environ["LAB"],
              "condition": os.environ["CONDITION"],
              "repeat": int(os.environ["REPEAT"]),
              "model": os.environ["MODEL"],
              "reasoning": os.environ["REASONING"],
              "repository": "discourse/discourse",
              "revision": "c89b1a0506a3ec0a249b7f23ac86763b358dc177",
          }, indent=2) + "\n")
          PY

          echo "prompt_file=$prompt_file" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "codex_home=$codex_home" >> "$GITHUB_OUTPUT"

      - name: Run Codex benchmark sample
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.prompt_file }}
          output-file: ${{ steps.prepare.outputs.output_dir }}/final.txt
          working-directory: discourse
          codex-home: ${{ steps.prepare.outputs.codex_home }}
          model: ${{ needs.config.outputs.model }}
          effort: ${{ needs.config.outputs.reasoning }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--json","--ephemeral"]'

      # Codex runs read-only and drop-sudo. This post-step only packages files
      # already written by the trusted action/runner harness.
      - name: Upload sample artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.condition }}-r${{ matrix.repeat }}
          path: ${{ steps.prepare.outputs.output_dir }}
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: aggregate
    if: ${{ always() }}
    needs: [config, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout rubydex-labs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download sample artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: sample-*
          path: ci-artifacts

      - name: Download completed sample job logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci/fetch-benchmark-job-logs.py \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --output ci-logs

      - name: Aggregate benchmark
        env:
          LAB: ${{ needs.config.outputs.lab }}
          MODEL: ${{ needs.config.outputs.model }}
          REASONING: ${{ needs.config.outputs.reasoning }}
        run: |
          python3 scripts/ci/aggregate-benchmark.py \
            --lab "$LAB" \
            --model "$MODEL" \
            --reasoning "$REASONING" \
            --artifacts ci-artifacts \
            --logs ci-logs \
            --output ci-report
          cat ci-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ci-report
          retention-days: 30
