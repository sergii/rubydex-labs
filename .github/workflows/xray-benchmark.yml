name: Rubydex X-Ray benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model
        required: true
        type: string
        default: gpt-5.6-luna
      reasoning:
        description: Reasoning effort
        required: true
        type: choice
        default: medium
        options:
          - low
          - medium
          - high
      repetitions:
        description: Samples per condition
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: rubydex-xray-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: resolve-config
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.resolve.outputs.model }}
      reasoning: ${{ steps.resolve.outputs.reasoning }}
      repeats_json: ${{ steps.resolve.outputs.repeats_json }}

    steps:
      - name: Resolve benchmark configuration
        id: resolve
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_REASONING: ${{ inputs.reasoning }}
          INPUT_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          model = os.environ["INPUT_MODEL"].strip()
          reasoning = os.environ["INPUT_REASONING"]
          repetitions = int(os.environ["INPUT_REPETITIONS"])

          if not model:
              raise SystemExit("model must not be empty")
          if reasoning not in {"low", "medium", "high"}:
              raise SystemExit(f"unsupported reasoning: {reasoning}")
          if repetitions not in {1, 3}:
              raise SystemExit("repetitions must be 1 or 3")

          print(f"model={model}")
          print(f"reasoning={reasoning}")
          print("repeats_json=[1]" if repetitions == 1 else "repeats_json=[1,2,3]")
          PY

  benchmark:
    name: sample-${{ matrix.condition }}-r${{ matrix.repeat }}
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        condition: [A, B, C]
        repeat: ${{ fromJSON(needs.config.outputs.repeats_json) }}

    steps:
      - name: Checkout rubydex-labs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true

      - name: Validate OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in repository Actions secrets." >&2
            exit 1
          fi

      - name: Prepare benchmark sample
        id: prepare
        env:
          CONDITION: ${{ matrix.condition }}
          REPEAT: ${{ matrix.repeat }}
          MODEL: ${{ needs.config.outputs.model }}
          REASONING: ${{ needs.config.outputs.reasoning }}
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/benchmark-output"
          codex_home="$RUNNER_TEMP/codex-home"
          fixture_dir="labs/06-xray-impact/fixture"
          mkdir -p "$output_dir" "$codex_home"

          case "$CONDITION" in
            A)
              prompt_file="labs/06-xray-impact/task.md"
              ;;
            B)
              prompt_file="labs/06-xray-impact/task-semantic-first.md"
              ;;
            C)
              prompt_file="labs/06-xray-impact/task-knowledge.md"
              ;;
            *)
              echo "Unsupported condition: $CONDITION" >&2
              exit 2
              ;;
          esac

          # Ground truth must never be available to the measured agent.
          rm -f labs/06-xray-impact/ground-truth.json

          # A/B intentionally do not receive company architecture knowledge or skills.
          if [ "$CONDITION" != "C" ]; then
            rm -rf labs/06-xray-impact/knowledge
            rm -rf labs/06-xray-impact/skills
          fi

          cat > "$codex_home/config.toml" <<EOF
          approval_policy = "never"
          EOF

          if [ "$CONDITION" = "B" ] || [ "$CONDITION" = "C" ]; then
            cat >> "$codex_home/config.toml" <<EOF

          [mcp_servers.rubydex]
          command = "env"
          args = ["BUNDLE_GEMFILE=${GITHUB_WORKSPACE}/Gemfile", "bundle", "exec", "rdx", "mcp"]
          cwd = "${GITHUB_WORKSPACE}/${fixture_dir}"
          enabled = true
          required = true
          default_tools_approval_mode = "approve"
          EOF
          fi

          python3 - "$output_dir/meta.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "lab": "06",
              "condition": os.environ["CONDITION"],
              "repeat": int(os.environ["REPEAT"]),
              "model": os.environ["MODEL"],
              "reasoning": os.environ["REASONING"],
              "repository": "sergii/rubydex-labs",
              "revision": os.environ["GITHUB_SHA"],
              "fixture": "labs/06-xray-impact/fixture",
          }, indent=2) + "\n")
          PY

          echo "prompt_file=$prompt_file" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "codex_home=$codex_home" >> "$GITHUB_OUTPUT"
          echo "fixture_dir=$fixture_dir" >> "$GITHUB_OUTPUT"

      - name: Run Codex benchmark sample
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.prompt_file }}
          output-file: ${{ steps.prepare.outputs.output_dir }}/final.txt
          working-directory: ${{ steps.prepare.outputs.fixture_dir }}
          codex-home: ${{ steps.prepare.outputs.codex_home }}
          model: ${{ needs.config.outputs.model }}
          effort: ${{ needs.config.outputs.reasoning }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--json","--ephemeral"]'

      - name: Upload sample artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xray-sample-${{ matrix.condition }}-r${{ matrix.repeat }}
          path: ${{ steps.prepare.outputs.output_dir }}
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: aggregate
    if: ${{ always() }}
    needs: [config, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout rubydex-labs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download sample artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: xray-sample-*
          path: ci-artifacts

      - name: Normalize artifact directory names
        run: |
          set -euo pipefail
          for path in ci-artifacts/xray-sample-*; do
            [ -d "$path" ] || continue
            base="$(basename "$path")"
            mv "$path" "ci-artifacts/${base#xray-}"
          done

      - name: Download completed sample job logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci/fetch-benchmark-job-logs.py \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --output ci-logs

      - name: Aggregate X-Ray benchmark
        env:
          MODEL: ${{ needs.config.outputs.model }}
          REASONING: ${{ needs.config.outputs.reasoning }}
        run: |
          python3 scripts/ci/aggregate-xray-benchmark.py \
            --model "$MODEL" \
            --reasoning "$REASONING" \
            --artifacts ci-artifacts \
            --logs ci-logs \
            --output ci-report
          cat ci-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: xray-benchmark-report
          path: ci-report
          retention-days: 30
