name: Trigger Rubydex X-Ray benchmark

on:
  push:
    branches: [main]
    paths:
      - benchmarks/requests/xray.json

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate and dispatch request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          request="benchmarks/requests/xray.json"

          model="$(jq -r '.model // empty' "$request")"
          reasoning="$(jq -r '.reasoning // empty' "$request")"
          repetitions="$(jq -r '.repetitions // empty' "$request")"

          if [ -z "$model" ]; then
            echo "model must not be empty" >&2
            exit 1
          fi

          case "$reasoning" in
            low|medium|high) ;;
            *)
              echo "reasoning must be low, medium, or high" >&2
              exit 1
              ;;
          esac

          case "$repetitions" in
            1|3) ;;
            *)
              echo "repetitions must be 1 or 3" >&2
              exit 1
              ;;
          esac

          gh workflow run xray-benchmark.yml \
            --ref main \
            -f model="$model" \
            -f reasoning="$reasoning" \
            -f repetitions="$repetitions"
